rtk_simulator_node:
  ros__parameters:
    # CSV轨迹文件路径
    csv_file_path: "~/auto_clean_bot/path/local_record_1.csv"

    # 发布频率 (Hz)
    publish_frequency: 5.0

    # 噪声范围 (百分比)
    noise_min_percentage: 0.0   # 最小噪声百分比
    noise_max_percentage: 1.0   # 最大噪声百分比

    # 是否循环播放轨迹
    loop_trajectory: true

    # GNSS pose 相关参数
    gnss_topic_name: "/gnss/pose"
    gnss_frame_id: "map"

    # 轨迹播放控制参数
    start_from_beginning: true    # 是否从轨迹开始播放
    playback_speed: 1.0          # 播放速度倍数 (1.0 = 正常速度)

    # 日志输出控制
    log_progress_interval: 100   # 每多少个点输出一次进度信息
