map_node:
  ros__parameters:
    # 地图文件目录 (相对于项目根目录)
    map_files_dir: "~/auto_clean_bot/map_files"
    
    # 边界文件名
    left_boundary_file: "local_record_5_left_boundary.csv"
    right_boundary_file: "local_record_5_right_boundary.csv"
    
    # 边界名称
    left_boundary_name: "left_boundary"
    right_boundary_name: "right_boundary"
    
    # 边界长度
    boundary_length: 30.0
    
    # 发布频率
    publish_frequency: 10.0

    # 方向稳定性参数
    direction_stability_weight: 2.0  # 方向稳定性权重
    max_index_jump: 100.0            # 最大索引跳跃限制,点数
    yaw_weight: 3.0                 # 航向差异权重