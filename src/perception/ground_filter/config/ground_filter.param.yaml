/**:
  ros__parameters:
    update_rate: 10.0 # 更新率
    min_height: 0.15 # 最小高度
    max_height: 2.0 # 最大高度
    base_frame: "base_link" # 基准坐标系
    target_frame: "base_link" # 目标坐标系
    use_sensor_frame: false # 是否使用传感器坐标系
    
    # 话题配置
    input_topic: "/lidar_points" # 输入点云话题
    ground_points_topic: "/ground_points" # 地面点云输出话题
    no_ground_points_topic: "/no_ground_points" # 非地面点云输出话题

    # 性能统计配置
    enable_timing_logs: true         # 是否启用耗时日志输出
    timing_log_interval: 10          # 耗时日志输出间隔（每N帧输出一次）
    enable_detailed_timing: false    # 是否启用详细的分步耗时统计（包含各步骤时间分布）
    enable_zero_copy: true           # 是否启用零拷贝优化（避免PCL转换，直接操作ROS消息）
