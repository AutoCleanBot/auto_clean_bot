obstacles_detection_lidar_node:
  ros__parameters:
    # 传感器以及车辆参数
    max_height: 3.0
    min_height: 0.0
    vehicle_height: 0.4
    vehicle_length: 0.4
    vehicle_width: 0.4
    # 聚类算法相关参数
    roi_width: 1.0
    cluster_tolerance: 0.4 # 最小可容忍点云点距离，单位米
    min_cluster_size: 20
    max_cluster_size: 30000
    leaf_size: 0.1
    plane_point_percent : 0.5 # 平面内点云点比例

    # 调试参数
    enable_visualization: false
    enable_use_roi: false
    enable_calculate_process_time: false
    enable_downsample: true
    segment_ground_type: 1 # 1:algorithm, 2:based on height
    # 相关订阅参数
    is_use_front_lidar: true
    front_lidar_frame_id: "front_lidar"
    front_lidar_topic: "drivers/front_lidar"
    is_use_left_lidar: false
    left_lidar_frame_id: "left_lidar"
    left_lidar_topic: "drivers/left_lidar"
    is_use_right_lidar: false
    right_lidar_frame_id: "right_lidar"
    right_lidar_topic: "drivers/right_lidar"

    # GNSS设备参数, is_use_gnss 是否将坐标转换到gnss的东北天坐标系下
    is_use_gnss: true
    gnss_frame_id: "gnss_link"
    gnss_topic: "gnss/pose"

    # BASE坐标系参数
    base_frame_id: "base_link"

    
    
