rtk_node:
  ros__parameters:
    # 设备配置
    device_name: "/dev/ttyTHS4"
    baud_rate: 460800
    timeout_ms: 20
    
    # 基准点配置
    base_latitude: 0.0
    base_longtitude: 0.0
    base_altitude: 0.0
    heading_offset: 0.0
    
    # 话题配置
    local_frame_id: "rtk_frame"
    local_topic_name: "rtk_fix"
    local_publish_rate: 10.0
    
    imu_frame_id: "imu_frame"
    imu_topic_name: "imu"
    imu_publish_rate: 10.0
    
    gnss_frame_id: "gnss_pose_enu_frame"
    gnss_topic_name: "gnss_pose_enu"
    gnss_publish_rate: 10.0
    
    # 日志配置
    enable_debug_log: true          # 是否启用调试日志
    log_interval: 10                 # 日志输出间隔（每N次解析输出一次调试日志）
                                     # 设置为0或负数则每次都输出（保持原有行为）
                                     # 建议值：10-50，根据数据频率调整
