radio_node:
  ros__parameters:
    # ============================================
    # 设备配置
    # ============================================
    device_name: '/dev/ttyUART_232_B'      # 串口设备路径
    baud_rate: 115200                # 波特率（232格式）
    timeout_ms: 20                   # 超时时间（毫秒）

    # ============================================
    # 话题配置
    # ============================================
    radio_frame_id: "radio_link"
    radio_topic_name: "radio/radio_info"
    radio_publish_rate: 50.0         # 发布频率（Hz）

    # ============================================
    # 通道映射配置
    # ============================================
    # linear_channel: 1                 # 线速度通道索引
    # steering_channel: 0               # 转向角通道索引
    # gear_channel: 4                   # 档位通道索引
    # mode_channel: 5                   # 控制模式通道索引

    # 通道缩放和偏移
    linear_scale: 1.0
    linear_offset: 0.0
    steering_scale: 1.0
    steering_offset: 0.0

    # 档位和模式阈值
    gear_forward_threshold: 0.4
    gear_reverse_threshold: -0.4
    mode_switch_threshold: 0.4

    # ============================================
    # 通道0配置（原始值范围：min_raw -> -1.0, center_raw -> 0.0, max_raw -> 1.0）
    # ============================================
    channel_0_min_raw: 0             # 通道0最小值
    channel_0_center_raw: 996       # 通道0中值（中心点，映射到0.0）
    channel_0_max_raw: 2047          # 通道0最大值

    # ============================================
    # 通道1配置
    # ============================================
    channel_1_min_raw: 0
    channel_1_center_raw: 1006
    channel_1_max_raw: 2047

    # ============================================
    # 通道2配置
    # ===========================================
    channel_2_min_raw: 0
    channel_2_center_raw: 1002
    channel_2_max_raw: 2047

    # ============================================
    # 通道3配置
    # ============================================
    channel_3_min_raw: 0
    channel_3_center_raw: 998
    channel_3_max_raw: 2047

    # ============================================
    # 通道4配置
    # ============================================
    channel_4_min_raw: 200
    channel_4_center_raw: 1024
    channel_4_max_raw: 1800

    # ============================================
    # 通道5配置
    # ============================================
    channel_5_min_raw: 200
    channel_5_center_raw: 1000
    channel_5_max_raw: 1800

    # ============================================
    # 通道6配置
    # ============================================
    channel_6_min_raw: 200
    channel_6_center_raw: 1000
    channel_6_max_raw: 1800

    # ============================================
    # 通道7配置
    # ============================================
    channel_7_min_raw: 200
    channel_7_center_raw: 1000
    channel_7_max_raw: 1800

    # ============================================
    # 通道8配置
    # ============================================
    channel_8_min_raw: 200
    channel_8_center_raw: 1000
    channel_8_max_raw: 1800

    # ============================================
    # 通道9配置
    # ============================================
    channel_9_min_raw: 200
    channel_9_center_raw: 1000
    channel_9_max_raw: 1800

    # ============================================
    # 通道10配置
    # ============================================
    channel_10_min_raw: 200
    channel_10_center_raw: 1000
    channel_10_max_raw: 1800

    # ============================================
    # 通道11配置
    # ============================================
    channel_11_min_raw: 210
    channel_11_center_raw: 1005
    channel_11_max_raw: 1800

    # ============================================
    # 通道12配置
    # ============================================
    channel_12_min_raw: 0
    channel_12_center_raw: 1024
    channel_12_max_raw: 2047

    # ============================================
    # 通道13配置
    # ============================================
    channel_13_min_raw: 0
    channel_13_center_raw: 1024
    channel_13_max_raw: 2047

    # ============================================
    # 通道14配置
    # ============================================
    channel_14_min_raw: 0
    channel_14_center_raw: 1024
    channel_14_max_raw: 2047

    # ============================================
    # 通道15配置
    # ============================================
    channel_15_min_raw: 0
    channel_15_center_raw: 1024
    channel_15_max_raw: 2047

    # ============================================
    # 日志配置
    # ============================================
    enable_debug_log: false          # 是否启用调试日志
    log_interval: 25                 # 日志输出间隔（每N次解析输出一次）

    # ============================================
    # 数据保存配置
    # ============================================
    enable_info_str_save: false      # 是否保存原始数据帧到文件
    info_str_save_dir: "/tmp/radio_logs"  # 保存目录

